<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="utf-8" />

  <title>Edit lesson</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1" />

  <link rel="icon"
        th:href="@{/favicon.ico}"
        href="/favicon.ico" />

  <link rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css" />

  <link rel="stylesheet"
        th:href="@{/css/pages/forms.css}"
        href="/css/pages/forms.css" />

  <link rel="stylesheet"
        th:href="@{/css/pages/schedule.css}"
        href="/css/pages/schedule.css" />

  <link rel="stylesheet"
        th:href="@{/css/pages/lesson-create.css}"
        href="/css/pages/lesson-create.css" />

</head>

<body class="ou-page lesson-create-page">

<div th:replace="~{fragments/header :: ouHeader('schedule')}"></div>

<main class="lesson-create-main">

  <th:block th:replace="~{lessons/fragments/lesson-common :: toolbar(
      'Edit lesson',
      'Update the lesson details and review other lessons scheduled for the selected day.',
      ${lesson_date}
  )}">
  </th:block>

  <div class="ou-alert ou-alert--warn"
       th:if="${selected_date != null
               and today != null
               and selected_date.isBefore(today)}">
    This date is in the past. Lessons must start in the future.
  </div>

  <div class="lesson-create-layout">

    <div class="lesson-create-column">

      <section class="ou-card lesson-create-context"
               aria-label="Lesson context">

        <div class="lesson-create-section-heading">

          <div>

            <h2 class="ou-card__title">
              Lesson context
            </h2>

            <p>
              Course and study group belong to this lesson and cannot be changed here.
            </p>

          </div>

        </div>

        <div class="lesson-create-availability-context">

          <div class="lesson-create-context-item">

            <span>Course</span>

            <strong th:text="|${lesson.courseCode} — ${lesson.courseName}|">
              CS-101 — Java Programming
            </strong>

          </div>

          <div class="lesson-create-context-item">

            <span>Study group</span>

            <strong th:text="${lesson.groupName}">
              SE-21
            </strong>

          </div>

        </div>

      </section>

      <section class="ou-card lesson-create-form-card"
               aria-label="Lesson details">

        <div class="lesson-create-section-heading">

          <div>

            <h2 class="ou-card__title">
              Lesson details
            </h2>

            <p>
              Change the schedule information and save the lesson.
            </p>

          </div>

          <span class="ou-badge"
                th:text="${lesson.groupName}">
            SE-21
          </span>

        </div>

        <form class="lesson-create-form"
              th:action="@{/lessons/{lessonId}/edit(
                  lessonId=${lesson.id}
              )}"
              th:object="${form}"
              method="post"
              novalidate>

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}" />

          <th:block th:replace="~{lessons/fragments/lesson-common :: formErrors}">
          </th:block>

          <th:block th:replace="~{lessons/fragments/lesson-common :: lessonFields(
              true,
              false
          )}">
          </th:block>

          <th:block th:replace="~{lessons/fragments/lesson-common :: formActions(
              ${lesson_date},
              'Save changes'
          )}">
          </th:block>

        </form>

      </section>

    </div>

    <th:block th:replace="~{lessons/fragments/lesson-availability :: editAvailability}">
    </th:block>

  </div>

</main>

</body>
</html>
