<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="utf-8" />

  <title th:text="${page.pageTitle}">
    Students
  </title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1" />

  <link rel="icon"
        th:href="@{/favicon.ico}"
        href="/favicon.ico" />

  <link rel="stylesheet"
        th:href="@{/css/app.css}"
        href="/css/app.css" />

  <link rel="stylesheet"
        th:href="@{/css/pages/students.css}"
        href="/css/pages/students.css" />

</head>

<body class="ou-page students-page">

  <div th:replace="~{fragments/header :: ouHeader('students')}">
  </div>

  <main class="students-main">

    <section class="ou-card students-shell"
             aria-label="Students">

      <div class="students-toolbar">

        <div>

          <h1 class="ou-card__title"
              th:text="${page.pageTitle}">
            Students
          </h1>

          <p class="students-subtitle"
             th:text="${page.pageSubtitle}">
            Students.
          </p>

        </div>

        <a class="ou-btn"
           th:if="${page.showCreateButton}"
           th:href="@{/students/create}">
          Create student
        </a>

      </div>

      <div class="ou-alert ou-alert--success"
           th:if="${ok != null and studentId == null}"
           th:text="${ok}">
        Done.
      </div>

      <div class="ou-alert ou-alert--error"
           th:if="${err != null and studentId == null}"
           th:text="${err}">
        Something went wrong.
      </div>

      <div class="students-grid"
           th:if="${!#lists.isEmpty(page.students)}">

        <th:block th:each="student : ${page.students}">

          <th:block th:replace="~{students/cards/student-card :: studentCard(
              ${student},
              ${page.showGroupInfo},
              ${page.showEnrollmentYear},
              ${page.currentPage}
          )}">
          </th:block>

        </th:block>

      </div>

      <div class="ou-alert ou-alert--warn"
           th:if="${#lists.isEmpty(page.students)}">
        No students found.
      </div>

      <nav class="students-pager"
           th:if="${page.totalPages > 1}"
           aria-label="Students pages">

        <a class="ou-btn ou-btn--ghost"
           th:if="${page.hasPrevious}"
           th:href="@{/students(page=${page.currentPage - 1})}">
          ← Previous
        </a>

        <th:block th:each="p : ${#numbers.sequence(0, page.totalPages - 1)}">

          <a class="ou-btn"
             th:classappend="${p == page.currentPage}
                 ? ''
                 : ' ou-btn--ghost'"
             th:href="@{/students(page=${p})}"
             th:text="${p + 1}">
            1
          </a>

        </th:block>

        <a class="ou-btn ou-btn--ghost"
           th:if="${page.hasNext}"
           th:href="@{/students(page=${page.currentPage + 1})}">
          Next →
        </a>

      </nav>

    </section>

  </main>

  <script th:src="@{/js/details-form-cancel.js}"
          src="/js/details-form-cancel.js">
  </script>

</body>
</html>
