<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="groupAdminActions(
    g,
    currentPage,
    isTarget,
    requestedName,
    err
)"
     class="group-actions-bar">

  <details class="group-self-edit"
           th:open="${isTarget and err != null and requestedName != null}">

    <summary class="ou-btn ou-btn--ghost">
      Update
    </summary>

    <form class="group-self-edit__form"
          method="post"
          th:action="@{/groups/{id}/rename(id=${g.id})}">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}" />

      <input type="hidden"
             name="page"
             th:value="${currentPage}" />

      <div class="group-self-edit__divider"
           aria-hidden="true">
      </div>

      <div class="group-self-edit__fields">

        <div>
          <label class="group-self-edit__label"
                 th:for="|name_${g.id}|">
            Name
          </label>

          <input class="ou-input"
                 th:id="|name_${g.id}|"
                 name="name"
                 type="text"
                 placeholder="Group name"
                 th:value="${isTarget and requestedName != null
                     ? requestedName
                     : g.name}" />
        </div>

      </div>

      <div class="group-self-edit__actions">

        <button type="button"
                class="ou-btn ou-btn--ghost"
                data-details-form-cancel>
          Cancel
        </button>

        <button type="submit"
                class="ou-btn">
          Save
        </button>

      </div>

    </form>

  </details>

  <div class="group-actions-bar__other">

    <form class="ou-inline-form group-actions-bar__delete"
          method="post"
          th:action="@{/groups/{id}/delete(id=${g.id})}">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}" />

      <input type="hidden"
             name="page"
             th:value="${currentPage}" />

      <button type="submit"
              class="ou-btn ou-btn--danger"
              onclick="return confirm('Delete this group?');">
        Delete
      </button>

    </form>

  </div>

</div>

</body>
</html>
