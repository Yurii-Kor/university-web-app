<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<title>Change password</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="icon"
		  th:href="@{/favicon.ico}"
		  href="/favicon.ico" />

	<link rel="stylesheet"
		  th:href="@{/css/app.css}"
		  href="/css/app.css" />

	<link rel="stylesheet"
		  th:href="@{/css/pages/profile.css}"
		  href="/css/pages/profile.css" />
</head>

<body class="profile-page">

<div th:replace="~{fragments/header :: ouHeader('profile')}"></div>

<main class="profile-main">
	<div class="profile-wrap">

		<section class="ou-card"
				 aria-labelledby="password-title">

			<div class="profile-card-inner">

				<h1 id="password-title"
					class="ou-card__title">
					Change password
				</h1>

				<div class="ou-alert ou-alert--error"
					 th:if="${err != null}"
					 th:text="${err}">
					Something went wrong.
				</div>

				<form th:action="@{/profile/password}"
					  method="post"
					  class="form-grid">

					<input type="hidden"
						   th:name="${_csrf.parameterName}"
						   th:value="${_csrf.token}" />

					<div class="form-row">
						<label for="currentPassword">
							Current password
						</label>

						<input id="currentPassword"
							   name="currentPassword"
							   class="ou-input"
							   type="password"
							   autocomplete="current-password"
							   required />
					</div>

					<div class="form-row">
						<label for="newPassword">
							New password
						</label>

						<input id="newPassword"
							   name="newPassword"
							   class="ou-input"
							   type="password"
							   autocomplete="new-password"
							   required />
					</div>

					<div class="form-row">
						<label for="confirmPassword">
							Confirm new password
						</label>

						<input id="confirmPassword"
							   name="confirmPassword"
							   class="ou-input"
							   type="password"
							   autocomplete="new-password"
							   required />
					</div>

					<div class="form-actions">
						<a th:href="@{/profile}"
						   class="ou-btn ou-btn--secondary">
							Back
						</a>

						<button type="submit"
								class="ou-btn">
							Change password
						</button>
					</div>
				</form>

			</div>
		</section>

	</div>
</main>

</body>
</html>
